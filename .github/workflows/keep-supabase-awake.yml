# Sends a small database WRITE to each Supabase project twice a day so the
# free plan never sees 7 days of inactivity (which would pause the project).
#
# BEFORE THIS WORKS: run the keepalive SQL (table + keepalive_ping function)
# once in the SQL Editor of EACH Supabase project. See the SQL at the bottom.
#
# The same file can live in BOTH repos. It needs no GitHub secrets: the URL and
# key values below are the public "anon" keys that are already visible inside
# your websites, so it is fine to keep them here.
name: Keep Supabase awake

on:
  schedule:
    # Twice a day at off-peak minutes (04:43 and 16:43 UTC), because GitHub
    # often delays scheduled runs at busy times like the top of the hour.
    - cron: '43 4,16 * * *'
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the wedding website database
        if: always()
        env:
          SUPABASE_URL: https://unxixhrmjhgnwqjelcli.supabase.co
          SUPABASE_KEY: sb_publishable_4SfIDiy61cFq8Qx2ZL2laQ_RTBnTZyy
        run: |
          code=$(curl -sS --max-time 30 -o resp.txt -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Wedding website database answered: HTTP $code"
          cat resp.txt
          echo
          [ "$code" -eq 200 ]

      - name: Ping the Save the Date database
        if: always()
        env:
          SUPABASE_URL: https://irbvxortgcebuiztfkoc.supabase.co
          SUPABASE_KEY: sb_publishable_R6cVCubWSuhKa4fVgSziKg_9g_3LVAN
        run: |
          code=$(curl -sS --max-time 30 -o resp.txt -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Save the Date database answered: HTTP $code"
          cat resp.txt
          echo
          [ "$code" -eq 200 ]

# ---------------------------------------------------------------------------
# SQL to run once in each Supabase project (SQL Editor > New query > Run):
#
# create table if not exists public.keepalive (id int primary key, last_ping timestamptz);
# insert into public.keepalive values (1, now()) on conflict (id) do nothing;
# alter table public.keepalive enable row level security;
#
# create or replace function public.keepalive_ping()
# returns timestamptz
# language sql
# security definer
# set search_path = public
# as $$
#   update public.keepalive set last_ping = now() where id = 1
#   returning last_ping;
# $$;
#
# revoke all on function public.keepalive_ping() from public;
# grant execute on function public.keepalive_ping() to anon;
# ---------------------------------------------------------------------------
